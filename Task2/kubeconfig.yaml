apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-test-app
  labels:
    app: scale-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scale-test-app
  template:
    metadata:
      labels:
        app: scale-test-app
    spec:
      containers:
        - name: scale-test-app
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "3Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: scale-test-app-service
  labels:
    app: scale-test-app
spec:
  selector:
    app: scale-test-app
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scale-test-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scale-test-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80